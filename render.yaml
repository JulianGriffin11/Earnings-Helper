services:
  - type: web
    name: earnings-helper
    runtime: python
    buildCommand: ./scripts/render-build.sh
    startCommand: ./scripts/start.sh
    preDeployCommand: cd backend && .venv/bin/alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SEC_USER_AGENT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
